<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="login.submit_button">Bejelentkezés</title>
  <link rel="stylesheet" href="../../global.css" />
  <link rel="stylesheet" href="../../modules/iphone-frame/iphone-frame.css" />
  <link rel="stylesheet" href="../../modules/icon/icon.css" />
  <link rel="stylesheet" href="../../modules/input/input.css" />
  <link rel="stylesheet" href="../../modules/button/button.css" />
  <link rel="stylesheet" href="../../modules/text-button/text-button.css" />
  <link rel="stylesheet" href="../../modules/banner/banner.css" />
  <link rel="stylesheet" href="../../modules/motion/motion.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="../../modules/page-transition/page-transition.css" />
  <script src="../../modules/page-transition/page-transition.js"></script>
  <script src="../../modules/theme/theme.js"></script>
  <script>window.theme.initTheme();</script>
  <script src="../../modules/pwa/pwa.js"></script>
  <script>window.pwaModule.init();</script>
</head>
<body>
  <div id="screen-content">
    <div class="login-page">
      <div class="login-header">
        <img class="login-logo" src="../../assets/logo-bet.png" width="96" height="96" alt="" />
        <h1 class="login-app-name sr-only" data-i18n="app.name"></h1>
        <h2 class="login-title" data-i18n="login.title"></h2>
        <p class="login-subtitle" data-i18n="login.subtitle"></p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div id="login-fields"></div>
        <div id="login-error" class="login-error"></div>
        <div id="login-submit-button"></div>
        <div id="login-forgot" class="login-link-row"></div>
      </form>
      <div id="login-biometric" class="login-biometric"></div>

      <div class="login-alt">
        <p class="login-or" data-i18n="login.or"></p>
        <div id="login-social-buttons" class="login-social-buttons"></div>
        <div id="login-portal-button" class="login-portal-button"></div>
        <div id="login-guest-button"></div>
        <p class="login-guest-hint" data-i18n="login.guest_hint"></p>
        <div id="login-register" class="login-link-row"></div>
      </div>
    </div>
  </div>

  <script src="../../locales/hu.js"></script>
  <script src="../../locales/hu-assist.js"></script>
  <script src="../../locales/hu-education.js"></script>
  <script src="../../locales/hu-product.js"></script>

  <script src="../../locales/hu-meta.js"></script>
  <script src="../../locales/en.js"></script>
  <script src="../../locales/en-assist.js"></script>
  <script src="../../locales/en-education.js"></script>
  <script src="../../locales/en-product.js"></script>
  <script src="../../locales/en-market.js"></script>
  <script src="../../locales/en-account.js"></script>
  <script src="../../locales/en-personal.js"></script>
  <script src="../../locales/en-meta.js"></script>
  <script src="../../modules/i18n/i18n.js"></script>
  <script src="../../modules/icon/icon.js"></script>
  <script src="../../modules/input/input.js"></script>
  <script src="../../modules/button/button.js"></script>
  <script src="../../modules/text-button/text-button.js"></script>
  <script src="../../modules/banner/banner.js"></script>
  <script src="../../modules/motion/motion.js"></script>
  <script src="../../modules/mock-network/mock-network.js"></script>
  <script src="../../modules/iphone-frame/iphone-frame.js"></script>
  <script src="../../modules/storage/seed-en.js"></script>
  <script src="../../modules/storage/storage.js"></script>
  <script src="login.js"></script>
</body>
</html>
